name: gadgetshop
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

# ------- PACKAGES -------#
dependencies:
  flutter:
    sdk: flutter

  # ------- UTILITY PACKAGES -------#
  #Icons
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1

  #  Keyboard Visibility
  flutter_keyboard_visibility: ^6.0.0

  # Firebase Packages
  firebase_core: ^3.12.1
  google_sign_in: ^6.3.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.6

  # UI Design
  flutter_easyloading: ^3.0.5
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  image_card: ^0.0.4

  #State Management
  get: ^4.7.2
  
  # Date Formatting
  intl: ^0.19.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # LOCAL ASSETS

  assets:
    - assets/icons/splash-icon.json
    - assets/icons/google.png

